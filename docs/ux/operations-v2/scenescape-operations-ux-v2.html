<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SceneScape Operations UX v2</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--soft:#f8fafb;--text:#1d2b34;--muted:#647580;--line:#e0e7eb;--accent:#086d77;--red:#b8323d;--amber:#986315;--green:#247650;--sidebar:232px} [data-theme=dark]{--bg:#11191f;--panel:#18232b;--soft:#1c2932;--text:#e4edf3;--muted:#a3b1bc;--line:#2d3c47;--accent:#71cbd0;--red:#ff9ca4;--amber:#edc484;--green:#8acfaa} *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:750;margin:0 8px 24px}.sub{font-size:9px;letter-spacing:1.5px;color:var(--muted);margin:20px 10px 8px;font-weight:700}.nav button{width:100%;border:0;background:none;color:var(--muted);padding:9px 10px;text-align:left;border-radius:7px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--soft);color:var(--accent);font-weight:650}.top{height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:3}.main{padding:24px 28px 40px;max-width:1600px}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700}h1{font-size:28px;margin:4px 0}h2{font-size:15px;margin:0}.muted{color:var(--muted)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}.card{padding:16px}.value{font-size:30px;font-weight:750;margin:5px 0}.panel{margin-top:16px}.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.pb{padding:16px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr);gap:16px}.map{height:470px;background:linear-gradient(135deg,var(--soft),var(--panel));position:relative;overflow:hidden}.zone{position:absolute;border:2px solid var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);clip-path:polygon(18% 22%,78% 16%,88% 70%,33% 84%,12% 52%);inset:55px 75px}.trip{position:absolute;width:180px;height:3px;background:var(--amber);transform:rotate(-17deg);left:55px;bottom:100px}.obj{position:absolute;width:12px;height:12px;background:var(--accent);border:3px solid var(--panel);border-radius:50%;box-shadow:0 0 0 1px var(--accent)}.offline{position:absolute;right:30px;top:36px;padding:8px 10px;border-radius:6px;background:#fff0f1;color:#b8323d;border:1px solid #f0b4bb}.incident{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.incident:last-child{border:0}.severity{font-size:10px;font-weight:700;padding:3px 6px;border-radius:4px}.critical{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}.warning{color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}table{border-collapse:collapse;width:100%}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:7px;padding:8px 11px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.pill{display:inline-flex;padding:4px 7px;border-radius:5px;background:var(--soft);border:1px solid var(--line);font-size:10px}.hidden{display:none}.drawer{position:fixed;top:0;right:-520px;width:min(500px,94vw);height:100vh;background:var(--panel);border-left:1px solid var(--line);z-index:10;transition:.2s;padding:22px;overflow:auto}.drawer.open{right:0}.timeline{height:9px;background:var(--soft);border-radius:6px;position:relative;margin:22px 0}.timeline:after{content:"";position:absolute;left:58%;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--accent)}.chart{height:220px;display:flex;align-items:end;gap:10px;padding:18px}.bar{flex:1;background:var(--accent);opacity:.75;border-radius:5px 5px 0 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.grid4{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.main{padding:18px}.top{padding:0 18px}}@media(max-width:520px){.grid4{grid-template-columns:1fr}.map{height:330px}.optional{display:none}}
</style>
</head>
<body><div class="shell"><aside class="side"><div class="brand">SceneScape</div><div class="sub">OPERATIONS · DATA PLANE</div><div class="nav"><button class="active" data-page="overview">Shift overview</button><button data-page="live">Live scene</button><button data-page="incidents">Incidents</button><button data-page="history">History & replay</button><button data-page="trends">Trends & analytics</button><button data-page="handover">Reports & handover</button><button data-page="health">Feed & service health</button></div><div class="sub">CONFIGURATION · CONTROL PLANE</div><div class="nav"><button data-page="places">Sites, floors & scenes</button><button data-page="inputs">Cameras & sensors</button><button data-page="geometry">Zones & tripwires</button><button data-page="rules">Alert rules</button></div><div class="sub">ADMINISTRATION</div><div class="nav"><button data-page="retention">History & retention</button><button data-page="access">Access & audit</button></div></aside><div><header class="top"><div>Chennai campus / Building 01 / <b>Warehouse A</b></div><div style="display:flex;gap:8px;align-items:center"><span class="pill">SYNTHETIC DATA</span><button class="btn" id="theme">◐</button></div></header><main class="main" id="main"></main></div></div><aside class="drawer" id="drawer"><button class="btn" onclick="closeDrawer()">Close</button><div id="drawerBody"></div></aside>
<script>
const $=s=>document.querySelector(s), main=$('#main'),drawer=$('#drawer'),drawerBody=$('#drawerBody');
const incidents=[['Critical','Person inside restricted zone','Restricted zone','New','Unassigned','10:41:32'],['Critical','Wrong-way crossing at north gate','North gate','Acknowledged','Shift lead','10:38:16'],['Warning','Camera 07 stopped reporting','Packing','New','Unassigned','10:34:18'],['Warning','Dwell time exceeded in packing','Packing','Investigating','Operations team','10:27:06']];
function head(k,t,s){return `<div class="eyebrow">${k}</div><h1>${t}</h1><p class="muted">${s}</p>`}
function kpis(){return `<div class="grid4">${[['Open incidents','4','2 critical · 2 unassigned'],['People in scene','42','Observed occupancy'],['Directional crossings','214','This shift · not unique people'],['Reporting inputs','7 / 8','1 offline']].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="value">${x[1]}</div><div class="muted">${x[2]}</div></div>`).join('')}</div>`}
function incidentList(){return incidents.map((x,i)=>`<div class="incident" onclick="openIncident(${i})"><span class="severity ${x[0]=='Critical'?'critical':'warning'}">${x[0]}</span><h3>${x[1]}</h3><div class="muted">${x[2]} · ${x[3]} · ${x[4]} · ${x[5]}</div></div>`).join('')}
function map(){return `<div class="map"><div class="zone"></div><div class="trip"></div><div class="offline">CAM-07 offline · coverage degraded</div><span class="obj" style="left:42%;top:38%"></span><span class="obj" style="left:55%;top:52%"></span><span class="obj" style="left:63%;top:28%"></span><span class="obj" style="left:30%;top:60%"></span></div>`}
function overview(){main.innerHTML=head('Observe · investigate · act','Your shift, at a glance','Ground floor / Warehouse A · Shift A 06:00–14:00 IST')+kpis()+`<div class="layout"><section class="panel"><div class="ph"><h2>Live scene context</h2><span class="pill">Coverage 96.8%</span></div>${map()}</section><section class="panel"><div class="ph"><h2>Needs your attention</h2><span class="pill">4 open</span></div><div class="pb">${incidentList()}</div></section></div>`}
function live(){main.innerHTML=head('Data plane','Live scene','Scene-first operational view with fused objects, spatial rules and input health.')+`<section class="panel">${map()}<div class="pb"><b>Interpretation rule:</b> missing camera coverage is shown as degraded observation, not as an empty area.</div></section>`}
function incidentPage(){main.innerHTML=head('Operations','Incidents','Prioritized operational work, ownership and response state.')+`<section class="panel"><div class="pb">${incidentList()}</div></section>`}
function history(){main.innerHTML=head('Investigate','History & replay','Metadata replay requires the proposed historian; recorded video is a separate integration.')+`<section class="panel"><div class="ph"><h2>INC-1042 · replay context</h2><span class="pill">Rule v7 · Map v4</span></div><div class="pb"><div class="toolbar"><button class="btn">−30 s</button><button class="btn primary">Play</button><button class="btn">+30 s</button><span class="pill">10:41:02–10:42:02</span></div><div class="timeline"></div>${map()}</div></section>`}
function trends(){main.innerHTML=head('Historical operations','Trends & analytics','Use retained aggregates to understand occupancy, crossings, dwell and data quality.')+`<div class="grid4"><div class="card"><div class="muted">Peak occupancy</div><div class="value">57</div></div><div class="card"><div class="muted">Median dwell</div><div class="value">6.4m</div></div><div class="card"><div class="muted">Crossings</div><div class="value">214</div></div><div class="card"><div class="muted">Coverage</div><div class="value">96.8%</div></div></div><section class="panel"><div class="ph"><h2>Observed occupancy by hour</h2><span class="pill">Synthetic</span></div><div class="chart">${[38,55,72,86,100,79,64,48].map((h,i)=>`<div class="bar" style="height:${h}%" title="Hour ${i+6}"></div>`).join('')}</div></section>`}
function generic(title,desc){main.innerHTML=head('Configuration / control plane',title,desc)+`<section class="panel"><div class="pb"><h2>Draft → Validate → Preview → Publish</h2><p class="muted">Production implementation must use native SceneScape contracts, preserve revision history, and retain an authenticated Django bridge wherever feature parity is not complete.</p><div class="toolbar"><button class="btn primary">Create draft</button><button class="btn">Validate</button><button class="btn">Preview</button><button class="btn">Publish revision</button></div></div></section>`}
function page(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p)); if(p==='overview')return overview();if(p==='live')return live();if(p==='incidents')return incidentPage();if(p==='history')return history();if(p==='trends')return trends(); if(p==='geometry')return generic('Zones & tripwires','Author regions, fences and directional tripwires in scene coordinates with geometry validation.');if(p==='rules')return generic('Alert rules','Geometry defines where; rules define when attention is required, severity, schedule, ownership and escalation.');if(p==='places')return generic('Sites, floors & scenes','Organize operational scope while preserving native scene coordinate and map semantics.');if(p==='inputs')return generic('Cameras & sensors','Onboard, assign, calibrate and validate coverage; health belongs in Operations.');if(p==='retention')return generic('History & retention','Retention governs observations, events, aggregates, incidents, audit and evidence independently.');if(p==='access')return generic('Access & audit','Keycloak-aware server authorization, scoped evidence access and immutable audit.');if(p==='handover')return generic('Reports & handover','Carry forward unresolved incidents, owners, coverage gaps and shift notes.');if(p==='health')return generic('Feed & service health','Expose stale inputs, ingestion lag, historian availability and degraded coverage.');}
function openIncident(i){const x=incidents[i];drawerBody.innerHTML=`<div class="eyebrow">Incident</div><h1>${x[1]}</h1><p><span class="severity ${x[0]=='Critical'?'critical':'warning'}">${x[0]}</span></p><p><b>Location</b><br>${x[2]}</p><p><b>Workflow</b><br>${x[3]} · ${x[4]}</p><p><b>Event time</b><br>${x[5]} IST</p><p class="muted">Rule revision, track/source references, correlated events, evidence and audit actions remain attached to this incident in the production design.</p><div class="toolbar"><button class="btn primary">Acknowledge</button><button class="btn">Investigate</button><button class="btn">Open replay</button></div>`;drawer.classList.add('open')}
function closeDrawer(){drawer.classList.remove('open')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));$('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';overview();
</script></body></html>
