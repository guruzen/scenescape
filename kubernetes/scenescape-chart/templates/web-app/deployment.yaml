---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web-dep
  labels:
    app: {{ .Release.Name }}-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-web
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-web
        {{ include "releaseLabels" . | indent 8 }}
    spec:
      shareProcessNamespace: true
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.pgserver.repository }}/{{ .Values.pgserver.image }}:{{ .Values.pgserver.tag}}
          imagePullPolicy: {{ .Values.pgserver.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db
                  key: DATABASE_PASSWORD
          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres to be ready..."
              until pg_isready -h pgserver.{{ .Release.Namespace }}.svc.cluster.local -U scenescape -d scenescape; do
                sleep 2
              done
              echo "Postgres is ready!"
          securityContext:
            {{ include "defaultContainerSecurityContext" . | indent 12 }}
      containers:
        - name: {{ .Release.Name }}-web
          image: {{ .Values.repository }}/{{ .Values.web.image }}:{{ .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.web.pullPolicy }}
          args:
            - webserver
            - --dbtype
            - postgres
            - --broker
            - broker.{{ .Release.Namespace }}.svc.cluster.local
            - --brokerauth
            - /run/secrets/browser.auth
            - --brokerrootcert
            - /run/secrets/certs/scenescape-ca.pem
            - --autocalibration
            - autocalibration.{{ .Release.Namespace }}.svc.cluster.local:8443
            - --overwrite-user-auth
          env:
          {{- if .Values.modernUI.enabled }}
          - name: KEYCLOAK_ENABLED
            value: "true"
          - name: KEYCLOAK_REALM
            value: {{ .Values.modernUI.auth.realm | quote }}
          - name: KEYCLOAK_CLIENT_ID
            value: {{ .Values.modernUI.auth.clientId | quote }}
          - name: KEYCLOAK_ADMIN_ROLE
            value: {{ .Values.modernUI.auth.adminRole | quote }}
          - name: KEYCLOAK_AUTO_PROVISION_USERS
            value: {{ .Values.modernUI.auth.autoProvisionUsers | quote }}
          - name: KEYCLOAK_VERIFY_SSL
            value: {{ .Values.modernUI.auth.verifySsl | quote }}
          {{- if .Values.keycloak.enabled }}
          - name: KEYCLOAK_ISSUER_URL
            value: "https://{{ .Values.certdomain }}/auth/realms/{{ .Values.modernUI.auth.realm }}"
          - name: KEYCLOAK_JWKS_URL
            value: "http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080/auth/realms/{{ .Values.modernUI.auth.realm }}/protocol/openid-connect/certs"
          - name: KEYCLOAK_URL
            value: "http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080/auth"
          - name: KEYCLOAK_ADMIN_URL
            value: "http://keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080/auth"
          - name: KEYCLOAK_ADMIN_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ if .Values.keycloak.existingSecret }}{{ .Values.keycloak.existingSecret }}{{ else }}{{ .Release.Name }}-keycloak-bootstrap{{ end }}
                key: username
          - name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ if .Values.keycloak.existingSecret }}{{ .Values.keycloak.existingSecret }}{{ else }}{{ .Release.Name }}-keycloak-bootstrap{{ end }}
                key: password
          {{- else }}
          - name: KEYCLOAK_ISSUER_URL
            value: {{ required "modernUI.auth.issuerUrl is required when embedded keycloak is disabled" .Values.modernUI.auth.issuerUrl | quote }}
          - name: KEYCLOAK_JWKS_URL
            value: {{ default (printf "%s/protocol/openid-connect/certs" (trimSuffix "/" .Values.modernUI.auth.issuerUrl)) .Values.modernUI.auth.jwksUrl | quote }}
          - name: KEYCLOAK_URL
            value: {{ required "modernUI.auth.keycloakUrl is required when embedded keycloak is disabled" .Values.modernUI.auth.keycloakUrl | quote }}
          {{- if .Values.modernUI.auth.adminSecret }}
          - name: KEYCLOAK_ADMIN_URL
            value: {{ .Values.modernUI.auth.keycloakUrl | quote }}
          - name: KEYCLOAK_ADMIN_USERNAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.modernUI.auth.adminSecret | quote }}
                key: {{ .Values.modernUI.auth.adminUsernameKey | quote }}
          - name: KEYCLOAK_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.modernUI.auth.adminSecret | quote }}
                key: {{ .Values.modernUI.auth.adminPasswordKey | quote }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.mapping.enabled }}
          - name: MAPPING_SERVICE_URL
            value: https://mapping.{{ .Release.Namespace }}.svc.cluster.local:8444
          {{- end }}
          - name: WEBSERVER_URL
            value: https://web.scenescape.svc.cluster.local
          - name: MODEL_CONFIGS_FOLDER
            value: /home/scenescape/Scenescape/models/models/model_configs
          - name: EXAMPLEDB
            value: /home/scenescape/Scenescape/sample_data/exampledb.tar.bz2
          - name: DBHOST
            value: pgserver
          - name: DBPORT
            value: "5432"
          - name: SUPASS
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-supass
                key: supass
{{- if ne (default .Values.dbroot "") "" }}
          - name: DBROOT
            value: {{ .Values.dbroot }}
{{- end }}
            {{ include "proxy_envs" . | indent 10 }}
          ports:
          - containerPort: 443
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - >
                curl --insecure -s https://localhost:443/api/v1/health |
                python3 -c 'import json,sys; data=json.load(sys.stdin); raise SystemExit(0 if data.get("ready") is True else 1)'
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 5
            initialDelaySeconds: 10
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - curl --insecure -fsS https://localhost:443/api/v1/health >/dev/null
            periodSeconds: 10
            timeoutSeconds: 60
            failureThreshold: 5
            initialDelaySeconds: 20
          resources: {}
          volumeMounts:
          - mountPath: /run/secrets/certs/scenescape-ca.pem
            subPath: scenescape-ca.pem
            name: certs
            readOnly: true
          - mountPath: /run/secrets/certs/scenescape-web.crt
            subPath: scenescape-web.crt
            name: certs
            readOnly: true
          - mountPath: /run/secrets/certs/scenescape-web.key
            subPath: scenescape-web.key
            name: certs
            readOnly: true
          - mountPath: /run/secrets/supass
            name: supass
          - mountPath: /run/secrets/django/secrets.py
            subPath: secrets.py
            name: secrets-py
            readOnly: true
          - mountPath: /run/secrets/browser.auth
            name: browser-auth
            subPath: browser.auth
            readOnly: true
          - mountPath: /run/secrets/controller.auth
            name: controller-auth
            subPath: controller.auth
            readOnly: true
          - mountPath: /run/secrets/calibration.auth
            name: calibration-auth
            subPath: calibration.auth
            readOnly: true
          - mountPath: /home/scenescape/Scenescape/media
            name: media-storage
          - mountPath: /workspace/media
            name: media-storage
          - mountPath: /home/scenescape/Scenescape/sample_data
            name: sample-data-storage
            subPath: sample_data
          - mountPath: /home/scenescape/Scenescape/models
            name: models-storage
          - mountPath: /workspace/migrations
            name: migrations-storage
      restartPolicy: Always
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{ include "certs_volume" . | indent 6 }}
      - name: supass
        secret:
          secretName: {{ .Release.Name }}-supass
      - name: secrets-py
        secret:
          secretName: {{ .Release.Name }}-secrets-py
      - name: browser-auth
        secret:
          secretName: {{ .Release.Name }}-browser.auth
      - name: controller-auth
        secret:
          secretName: {{ .Release.Name }}-controller.auth
      - name: calibration-auth
        secret:
          secretName: {{ .Release.Name }}-calibration.auth
      - name: media-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-media-pvc
      - name: sample-data-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-sample-data-pvc
      - name: models-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-models-pvc
      - name: migrations-storage
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-migrations-pvc
status: {}
{{- end }}
