{{- if and (or .Values.modernUI.enabled .Values.native.enabled) .Values.keycloak.enabled (not .Values.keycloak.existingSecret) }}
{{- $secretName := printf "%s-keycloak-bootstrap" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := randAlphaNum 32 -}}
{{- if $existing }}
{{- $password = (index $existing.data "password" | b64dec) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.bootstrapAdminUsername | quote }}
  password: {{ default $password .Values.keycloak.bootstrapAdminPassword | quote }}
{{- end }}
