{{- if and .Values.modernUI.enabled .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: {{ .Release.Name }}-keycloak
spec:
  selector:
    app: {{ .Release.Name }}-keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
