{{- if and .Values.native.enabled (not .Values.native.existingSecret) }}
{{- $secretName := printf "%s-native-api" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $key := randAlphaNum 48 -}}
{{- if $existing }}
{{- $key = (index $existing.data .Values.native.signingKeyKey | b64dec) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
type: Opaque
stringData:
  {{ .Values.native.signingKeyKey }}: {{ default $key .Values.native.signingKey | quote }}
{{- end }}
