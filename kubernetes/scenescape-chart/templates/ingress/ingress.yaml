{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  annotations:
{{- range $key, $value := .Values.ingress.annotations }}
{{ $key | indent 4 }}: {{ $value | quote }}
{{- end }}
spec:
  rules:
  - http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
{{- if or .Values.modernUI.enabled .Values.native.enabled }}
            name: modern-ui
            port:
              number: {{ .Values.modernUI.service.port }}
{{- else }}
            name: web
            port:
              number: 80
{{- end }}
#      - pathType: Prefix
#        path: /mqtt
#        backend:
#          service:
#            name: broker
#            port:
#              number: 1884
{{- if ne (default .Values.ingress.className "") "" }}
  ingressClassName: {{ .Values.ingress.className }}
{{- end }}
{{- end }}
