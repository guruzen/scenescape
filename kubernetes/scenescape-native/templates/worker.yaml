{{- $name := include "native.name" . -}}
{{- if and (gt (int .Values.worker.replicas) 1) (not .Values.mqtt.sharedSubscriptionGroup) }}
{{- fail "mqtt.sharedSubscriptionGroup is required when worker.replicas > 1" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata: {name: "{{ $name }}-worker"}
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy: {type: RollingUpdate}
  selector:
    matchLabels: {app: "{{ $name }}-worker"}
  template:
    metadata:
      labels: {app: "{{ $name }}-worker"}
    spec:
      securityContext: {fsGroup: 1000}
      terminationGracePeriodSeconds: 30
      {{- if gt (int .Values.worker.replicas) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: "{{ $name }}-worker"}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-api-schema
          image: {{ .Values.api.image | quote }}
          command: [python, -c]
          args:
            - "import time,ssl,urllib.request; u='https://{{ $name }}-api:443/api/v1/health';\nwhile True:\n try:\n  urllib.request.urlopen(u,context=ssl._create_unverified_context(),timeout=5); break\n except Exception: time.sleep(2)"
          securityContext:
            {{- include "native.security" . | nindent 12 }}
      containers:
        - name: worker
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          args: [worker]
          env:
            {{- include "native.dbEnv" . | nindent 12 }}
            - {name: MEDIA_ROOT, value: /data/media}
            - {name: MQTT_HOST, value: {{ required "mqtt.host is required" .Values.mqtt.host | quote }}}
            - {name: MQTT_PORT, value: {{ .Values.mqtt.port | quote }}}
            - {name: MQTT_CLIENT_ID, value: {{ .Values.mqtt.clientId | quote }}}
            - name: MQTT_CLIENT_ID_SUFFIX
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - {name: MQTT_SHARED_SUBSCRIPTION_GROUP, value: {{ .Values.mqtt.sharedSubscriptionGroup | quote }}}
            - {name: MQTT_CA_FILE, value: /run/secrets/mqtt/ca.crt}
            - {name: MQTT_AUTH_FILE, value: /run/secrets/auth/browser.auth}
            - {name: HISTORY_SAMPLE_SECONDS, value: {{ .Values.history.sampleSeconds | quote }}}
            - {name: HISTORY_RETENTION_DAYS, value: {{ .Values.history.observationDays | quote }}}
            - {name: EVENT_RETENTION_DAYS, value: {{ .Values.history.eventDays | quote }}}
            - {name: BLUETOOTH_POSITIONING_ENABLED, value: {{ .Values.bluetooth.enabled | quote }}}
            - {name: BLUETOOTH_TELEMETRY_ENABLED, value: {{ .Values.bluetooth.telemetryEnabled | quote }}}
            - {name: BLUETOOTH_SPATIAL_EVENTS_ENABLED, value: {{ .Values.bluetooth.spatialEventsEnabled | quote }}}
            - {name: BLUETOOTH_FUSION_ENABLED, value: {{ .Values.bluetooth.fusionEnabled | quote }}}
            - {name: BLUETOOTH_SOLVER_QUEUE_CAPACITY, value: {{ .Values.bluetooth.solverQueueCapacity | quote }}}
            - {name: BLUETOOTH_SOLVER_DRAIN_PER_MESSAGE, value: {{ .Values.bluetooth.solverDrainPerMessage | quote }}}
            - {name: BLUETOOTH_REPLAY_WINDOW_S, value: {{ .Values.bluetooth.replayWindowSeconds | quote }}}
            - {name: BLUETOOTH_MAX_RANGE_M, value: {{ .Values.bluetooth.maxRangeM | quote }}}
            {{- if .Values.autocalibration.url }}
            - {name: AUTOCALIBRATION_URL, value: {{ .Values.autocalibration.url | quote }}}
            - {name: UPSTREAM_CA_FILE, value: /run/secrets/autocalibration/ca.crt}
            {{- end }}
          volumeMounts:
            - {name: media, mountPath: /data/media}
            - {name: service-auth, mountPath: /run/secrets/auth, readOnly: true}
            - {name: mqtt-ca, mountPath: /run/secrets/mqtt, readOnly: true}
            {{- if .Values.autocalibration.url }}
            - {name: autocalibration-ca, mountPath: /run/secrets/autocalibration, readOnly: true}
            {{- end }}
          readinessProbe:
            exec:
              command: [python, -m, scenescape_api.cli, worker-ready]
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [python, -m, scenescape_api.cli, worker-health]
            periodSeconds: 20
            failureThreshold: 6
          startupProbe:
            exec:
              command: [python, -m, scenescape_api.cli, worker-health]
            periodSeconds: 5
            failureThreshold: 30
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "native.security" . | nindent 12 }}
      volumes:
        - name: media
          persistentVolumeClaim: {claimName: "{{ .Values.media.existingClaim }}"}
        - name: service-auth
          secret: {secretName: "{{ .Values.serviceAuthSecret }}"}
        - name: mqtt-ca
          secret: {secretName: {{ required "mqtt.caSecret is required" .Values.mqtt.caSecret | quote }}}
        {{- if .Values.autocalibration.url }}
        - name: autocalibration-ca
          secret: {secretName: {{ .Values.autocalibration.caSecret | quote }}}
        {{- end }}
