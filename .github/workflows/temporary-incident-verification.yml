name: "Temporary incident UX verification"

on:
  push:
    branches:
      - feature/react-keycloak-modern-ui

permissions:
  contents: read

jobs:
  incident-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run focused incident API regressions
        shell: bash
        run: |
          python3 -m venv .venv-incidents
          . .venv-incidents/bin/activate
          python -m pip install --upgrade pip
          pip install -r control-api/requirements.txt -r control-api/requirements-test.txt
          PYTHONPATH=control-api pytest -q             control-api/tests/test_native_api.py::test_incident_action_and_audit             control-api/tests/test_native_api.py::test_incident_enrichment_and_filters             control-api/tests/test_native_api.py::test_incidents_and_overview_respect_scene_scope

      - name: Use Node.js 22
        shell: bash
        run: |
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm use 22
          fi
          node --version
          npm --version

      - name: Install Modern UI dependencies
        working-directory: modern-ui
        run: npm install --no-audit --no-fund

      - name: Run Modern UI UX tests
        working-directory: modern-ui
        run: npm run test:ux

      - name: Run TypeScript typecheck
        working-directory: modern-ui
        run: npm run typecheck

      - name: Run production build
        working-directory: modern-ui
        run: npm run build
