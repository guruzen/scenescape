# SPDX-License-Identifier: Apache-2.0
name: "[Bluetooth] BT-11 Calibration Coverage"

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - feature/react-keycloak-modern-ui
    paths:
      - "control-api/scenescape_api/bluetooth_survey.py"
      - "control-api/scenescape_api/bluetooth_positioning.py"
      - "control-api/scenescape_api/bluetooth_api.py"
      - "control-api/tests/test_bluetooth_survey.py"
      - "control-api/tests/browser_server.py"
      - "modern-ui/src/native/BluetoothCalibration.tsx"
      - "modern-ui/src/native/bluetoothApi.ts"
      - "modern-ui/src/native/native.css"
      - "modern-ui/tests/e2e/nativeSceneWorkspace.spec.ts"
      - "docs/specs/bluetooth-positioning/BT-11-advanced-calibration-and-coverage.md"
      - ".github/evidence/bluetooth-positioning/BT-11-advanced-calibration-and-coverage.md"
      - ".github/workflows/bluetooth-bt11-gate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bluetooth-bt11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "BT-11 calibration regression"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create Python environment
        run: |
          python3 -m venv .venv-bt11
          . .venv-bt11/bin/activate
          python -m pip install --upgrade pip
          pip install -r control-api/requirements.txt -r control-api/requirements-test.txt
      - name: Run BT-11 survey and coverage tests
        env:
          PYTHONPATH: control-api
        run: |
          . .venv-bt11/bin/activate
          python -m compileall -q control-api/scenescape_api/bluetooth_survey.py
          pytest -q control-api/tests/test_bluetooth_survey.py

  ui:
    name: "BT-11 integrated survey UI"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Use Node.js 22
        run: |
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm use 22
          fi
          node --version
      - name: Install Modern UI dependencies
        working-directory: modern-ui
        run: npm install --no-audit --no-fund
      - name: Create native API test environment
        run: |
          python3 -m venv .venv-bt11-browser
          . .venv-bt11-browser/bin/activate
          python -m pip install --upgrade pip
          pip install -r control-api/requirements.txt -r control-api/requirements-test.txt
      - name: Start native API test server
        run: |
          . .venv-bt11-browser/bin/activate
          PYTHONPATH=control-api nohup python control-api/tests/browser_server.py > /tmp/bt11-browser-api.log 2>&1 &
          echo $! > /tmp/bt11-browser-api.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8765/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/bt11-browser-api.log
          exit 1
      - name: Install Playwright Chromium
        working-directory: modern-ui
        run: npx playwright install --with-deps chromium
      - name: Typecheck and build
        working-directory: modern-ui
        run: |
          npm run typecheck
          npm run build
      - name: Run BT-11 integrated Playwright
        working-directory: modern-ui
        run: npx playwright test --config tests/e2e/native.playwright.config.ts --grep "BT-11 integrated survey diagnostics"
      - name: Upload BT-11 coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bt11-survey-coverage-evidence
          path: |
            modern-ui/test-results-native/**/bt11-survey-coverage.png
            /tmp/bt11-browser-api.log
          if-no-files-found: warn
          retention-days: 30
      - name: Stop native API test server
        if: always()
        run: |
          if [ -f /tmp/bt11-browser-api.pid ]; then
            kill "$(cat /tmp/bt11-browser-api.pid)" || true
          fi
