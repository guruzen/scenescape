name: "[Bluetooth] BT-07 Positioning Engine"

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - feature/react-keycloak-modern-ui
    paths:
      - "control-api/scenescape_api/bluetooth_positioning.py"
      - "control-api/scenescape_api/database.py"
      - "control-api/tests/test_bluetooth_positioning.py"
      - "docs/specs/bluetooth-positioning/BT-07-positioning-engine-v1.md"
      - ".github/evidence/bluetooth-positioning/BT-07-positioning-engine-v1.md"
      - ".github/workflows/bluetooth-bt07-gate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bluetooth-bt07-${{ github.ref }}
  cancel-in-progress: true

jobs:
  positioning:
    name: "BT-07 solver regression"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Create Python environment
        run: |
          python3 -m venv .venv-bt07
          . .venv-bt07/bin/activate
          python -m pip install --upgrade pip
          pip install -r control-api/requirements.txt -r control-api/requirements-test.txt

      - name: Compile positioning module
        env:
          PYTHONPATH: control-api
        run: |
          . .venv-bt07/bin/activate
          python -m compileall -q control-api/scenescape_api/bluetooth_positioning.py

      - name: Run BT-07 positioning tests
        env:
          PYTHONPATH: control-api
        run: |
          . .venv-bt07/bin/activate
          pytest -q control-api/tests/test_bluetooth_positioning.py
