name: "Temporary Grype remediation verification"

on:
  push:
    branches:
      - feature/react-keycloak-modern-ui

permissions:
  contents: read

jobs:
  grype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          grype version
      - name: Scan
        env:
          GRYPE_DB_AUTO_UPDATE: "true"
        run: |
          grype dir:. -o json > grype-remediation.json
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          data = json.loads(Path("grype-remediation.json").read_text())
          rows = []
          seen = set()
          for match in data.get("matches", []):
              vuln = match.get("vulnerability", {}) or {}
              art = match.get("artifact", {}) or {}
              key = (vuln.get("id"), art.get("name"), art.get("version"), art.get("type"))
              if key in seen:
                  continue
              seen.add(key)
              fix = vuln.get("fix", {}) or {}
              rows.append({
                  "severity": vuln.get("severity") or "Unknown",
                  "id": vuln.get("id") or "",
                  "package": art.get("name") or "",
                  "version": art.get("version") or "",
                  "type": art.get("type") or "",
                  "fixes": fix.get("versions") or [],
              })
          counts = Counter(r["severity"] for r in rows)
          print("GRYPE_VERIFY_BEGIN")
          print("total=" + str(len(rows)))
          for sev in ["Critical","High","Medium","Low","Negligible","Unknown"]:
              print(sev.lower() + "=" + str(counts.get(sev, 0)))
          for r in rows:
              if r["severity"] in {"Critical","High"}:
                  print("FINDING|{severity}|{id}|{package}|{version}|{type}|{fixes}".format(
                      severity=r["severity"], id=r["id"], package=r["package"],
                      version=r["version"], type=r["type"],
                      fixes=",".join(r["fixes"]) or "-"
                  ))
          print("GRYPE_VERIFY_END")
          if counts.get("Critical", 0) or counts.get("High", 0):
              raise SystemExit(1)
          PY
      - name: Upload raw Grype JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-remediation-verification
          path: grype-remediation.json
          if-no-files-found: error
          retention-days: 14
