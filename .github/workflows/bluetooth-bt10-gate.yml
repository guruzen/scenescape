# SPDX-License-Identifier: Apache-2.0
name: "[Bluetooth] BT-10 Device Telemetry"

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - feature/react-keycloak-modern-ui
    paths:
      - "control-api/scenescape_api/bluetooth_telemetry.py"
      - "control-api/scenescape_api/bluetooth_api.py"
      - "control-api/tests/test_bluetooth_telemetry.py"
      - "modern-ui/src/native/BluetoothPositioning.tsx"
      - "modern-ui/src/native/bluetoothApi.ts"
      - "modern-ui/tests/e2e/sceneWorkspace.spec.ts"
      - "docs/specs/bluetooth-positioning/BT-10-device-and-battery-telemetry.md"
      - ".github/evidence/bluetooth-positioning/BT-10-device-and-battery-telemetry.md"
      - ".github/workflows/bluetooth-bt10-gate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bluetooth-bt10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: "BT-10 telemetry regression"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create Python environment
        run: |
          python3 -m venv .venv-bt10
          . .venv-bt10/bin/activate
          python -m pip install --upgrade pip
          pip install -r control-api/requirements.txt -r control-api/requirements-test.txt
      - name: Run BT-10 tests
        env:
          PYTHONPATH: control-api
        run: |
          . .venv-bt10/bin/activate
          python -m compileall -q control-api/scenescape_api/bluetooth_telemetry.py
          pytest -q control-api/tests/test_bluetooth_telemetry.py

  ui:
    name: "BT-10 telemetry UI"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Use Node.js 22
        run: |
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm install 22
            nvm use 22
          fi
          node --version
      - name: Install UI dependencies
        working-directory: modern-ui
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: modern-ui
        run: npx playwright install --with-deps chromium
      - name: Typecheck and build
        working-directory: modern-ui
        run: |
          npm run typecheck
          npm run build
      - name: Run BT-10 telemetry Playwright
        working-directory: modern-ui
        run: npx playwright test --config tests/e2e/playwright.config.ts --grep "BT-10 device telemetry"
      - name: Upload BT-10 screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bt10-telemetry-ui-evidence
          path: modern-ui/test-results/**/bt10-device-telemetry.png
          if-no-files-found: warn
          retention-days: 30
