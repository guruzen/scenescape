name: "Temporary branch formatter"

on:
  push:
    branches:
      - feature/react-keycloak-modern-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feature/react-keycloak-modern-ui
          persist-credentials: true

      - name: Install Prettier dependencies
        run: |
          cp .github/resources/package.json package.json
          npm install
          rm package.json

      - name: Apply repository Prettier formatting
        run: make prettier-write

      - name: Apply repository two-space Python indentation
        run: |
          tests/scripts/reindent -n --level=2             control-api/scenescape_api/app.py             control-api/scenescape_api/asset_service.py             control-api/scenescape_api/auth.py             control-api/scenescape_api/calibration_service.py             control-api/scenescape_api/camera_io.py             control-api/scenescape_api/camera_service.py             control-api/scenescape_api/cli.py             control-api/scenescape_api/contracts.py             control-api/scenescape_api/database.py             control-api/scenescape_api/hierarchy.py             control-api/scenescape_api/ingest.py             control-api/scenescape_api/intrinsics.py             control-api/scenescape_api/keycloak_admin.py             control-api/scenescape_api/map_processing.py             control-api/scenescape_api/mapping_service.py             control-api/scenescape_api/markers.py             control-api/scenescape_api/media_files.py             control-api/scenescape_api/migrate_legacy.py             control-api/scenescape_api/mqtt_commands.py             control-api/scenescape_api/pipeline_generation.py             control-api/scenescape_api/resources.py             control-api/scenescape_api/scene_config.py             control-api/scenescape_api/scene_import_native.py             control-api/scenescape_api/scene_service.py             control-api/scenescape_api/sensor_service.py             control-api/tests/browser_server.py             control-api/tests/test_contracts.py             control-api/tests/test_hierarchy.py             control-api/tests/test_hierarchy_api.py             control-api/tests/test_keycloak_admin.py             control-api/tests/test_mqtt_commands.py             control-api/tests/test_native_api.py             control-api/tests/test_native_data.py             control-api/tests/test_runtime.py             control-api/tests/test_scene_config_lifecycle.py             modern-ui/tests/browser_checks.py             tools/export_legacy.py             tools/native_data.py             tools/native_runtime.py

      - name: Verify formatter gates before commit
        run: |
          make prettier-check
          make indent-check

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/temporary-branch-format.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Fix repository lint formatting"
          git push origin HEAD:feature/react-keycloak-modern-ui
